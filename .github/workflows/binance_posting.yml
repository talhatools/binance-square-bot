name: Binance Square Automated Posting Bot

on:
  schedule:
    # Runs every 15 minutes (24/7 in the cloud at $0 cost)
    - cron: '*/15 * * * *'
  workflow_dispatch:
    # Allows manual 1-click test run from GitHub Actions tab
    inputs:
      force_run:
        description: 'Force post (bypass coin cooldown)'
        required: false
        type: boolean
        default: true

concurrency:
  group: binance-square-posting
  cancel-in-progress: false

jobs:
  publish_post:
    name: Scan Market & Publish Post
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore SQLite Database Cache
        uses: actions/cache/restore@v4
        with:
          path: data/
          key: square-bot-db-${{ github.run_id }}
          restore-keys: |
            square-bot-db-

      - name: Execute Automated Posting Cycle
        env:
          BINANCE_SQUARE_OPENAPI_KEY: ${{ secrets.BINANCE_SQUARE_OPENAPI_KEY }}
          DISABLE_CLAUDE_API: "true"
          DRY_RUN: "false"
          CHART_STYLE: "both"
          WATERMARK_TEXT: "Talha Sniper"
          MIN_24H_QUOTE_VOLUME: "10000000"
          COOLDOWN_HOURS: "2"
          DAILY_POST_LIMIT: "100"
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ "${{ github.event.inputs.force_run }}" = "false" ]; then
            echo "Running in standard cooldown mode..."
            python main.py --run-once
          else
            echo "Running in high-priority force mode (bypassing coin cooldown)..."
            python main.py --run-once --force
          fi

      - name: Save Updated SQLite Database Cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/
          key: square-bot-db-${{ github.run_id }}

      - name: Upload Run Logs & Generated Charts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: square-bot-artifacts-${{ github.run_number }}
          path: |
            logs/
            charts/
          retention-days: 3
