name: Binance Square Automated Posting Bot

on:
  schedule:
    # Runs every 15 minutes (24/7 in the cloud at $0 cost)
    - cron: '*/15 * * * *'
  workflow_dispatch:
    # Allows manual 1-click test run from GitHub Actions tab
    inputs:
      force_run:
        description: 'Force post (bypass coin cooldown)'
        required: false
        type: boolean
        default: false
      chart_style:
        description: 'Chart Visual Style (sada=Clean Binance Screenshot, mobile=Binance Mobile App, competitor=Competitor With Lines, tradingview=Pro Dark, both=Mix)'
        required: false
        type: choice
        options:
          - sada
          - mobile
          - competitor
          - binance
          - tradingview
          - both
        default: 'sada'
      coin:
        description: 'Specific coin to post (e.g. BTC, ETH, SOL, XRP). Leave empty for auto-scan.'
        required: false
        type: string
        default: ''
      min_volume_millions:
        description: 'Min 24h Futures Volume in Millions USDT (e.g. 25, 50, 100, 10). Leave empty for default.'
        required: false
        type: string
        default: ''

concurrency:
  group: binance-square-posting
  cancel-in-progress: false

jobs:
  publish_post:
    name: Scan Market & Publish Post
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore SQLite Database Cache
        uses: actions/cache/restore@v4
        with:
          path: data/
          key: square-bot-db-${{ github.run_id }}
          restore-keys: |
            square-bot-db-

      - name: Execute Automated Posting Cycle
        env:
          BINANCE_SQUARE_OPENAPI_KEY: ${{ secrets.BINANCE_SQUARE_OPENAPI_KEY }}
          DISABLE_CLAUDE_API: "true"
          DRY_RUN: "false"
          CHART_STYLE: ${{ github.event.inputs.chart_style || vars.CHART_STYLE || 'sada' }}
          WATERMARK_TEXT: ${{ vars.WATERMARK_TEXT || secrets.WATERMARK_TEXT || 'Talha Sniper' }}
          MIN_24H_QUOTE_VOLUME: ${{ github.event.inputs.min_volume_millions || vars.MIN_24H_QUOTE_VOLUME || '25000000' }}
          COOLDOWN_HOURS: "3"
          DAILY_POST_LIMIT: "100"
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          COIN_INPUT="${{ github.event.inputs.coin }}"
          VOL_INPUT="${{ github.event.inputs.min_volume_millions }}"
          VOL_FLAG=""
          if [ -n "$VOL_INPUT" ]; then
            echo "Custom 24h Futures Volume Filter specified: $VOL_INPUT Million USDT"
            VOL_FLAG="--min-volume $VOL_INPUT"
          fi

          if [ -n "$COIN_INPUT" ]; then
            echo "Running in SPECIFIC COIN mode: $COIN_INPUT (force mode auto-enabled)..."
            python main.py --run-once --force --coin "$COIN_INPUT" $VOL_FLAG
          elif [ "${{ github.event.inputs.force_run }}" = "true" ]; then
            echo "Running in high-priority force mode (bypassing coin cooldown)..."
            python main.py --run-once --force $VOL_FLAG
          else
            echo "Running in standard cooldown mode (guaranteeing different coins)..."
            python main.py --run-once $VOL_FLAG
          fi

      - name: Save Updated SQLite Database Cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/
          key: square-bot-db-${{ github.run_id }}

      - name: Upload Run Logs & Generated Charts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: square-bot-artifacts-${{ github.run_number }}
          path: |
            logs/
            charts/
          retention-days: 3
