name: 👁️ Preview Post Style (Dummy Preview)

on:
  workflow_dispatch:
    inputs:
      post_style:
        description: |
          👇 POST STYLES PREVIEWS (Box ke neeche sample post dekhein):
          [sniper] ➔ 🚀 Guys, LONG $BTC Now! 📍 Entry: $91,200 🎯 TP1: $93,500 🛑 SL: $89,800 👉 Execute trade on $BTC now! 💰
          [technical] ➔ 📊 Multi-TF TA on $BTC. MA20 support held + RSI 58. 📍 Entry: 91k-92k 🎯 TP1: 93.5k (+2.5%) 🛑 SL: 89.8k (-2%)
          [clean] ➔ ✨ $BTC BIG LONG : Testing support, clean bounce triggers sharp move! 📍 Entry: 91k-92k 🛑 SL: 89.8k 🎯 TP1: 93.5k
          [conversational] ➔ 💬 guys, have you seen what’s happening with $BTC ? 🚨 Momentum exhaustion. 📍 Entry: 91k-92k 🛑 SL: 89.8k
          [danger_zone] ➔ ⚠️ $BTC ENTERING CRITICAL DANGER ZONE ... UNWIND. Watching for BIG LONG around here. 📍 Entry: 91k-92k
          [whale] ➔ 🐋 $BTC The harder they dump into support, the harder the reversal! Big players trap late retail. 📍 Entry: 91k-92k
          [reversal] ➔ 🔄 I’m going to open a BIG LONG on $BTC here. 📍 Entry: 91k-92k 🎯 TP: 95k 🛑 SL: 89.8k Flush already happened! 🚀
          [all] ➔ Tamam styles ka ikatha dummy preview dekhein.
        required: true
        type: choice
        options:
          - 'sniper ➔ 🚀 Guys, LONG $BTC Now! Entry: $92k | TP: $95k | SL: $90k'
          - 'technical ➔ BTC structure. 🟢 LONG $BTC | Bias: Bullish | Entry, TPs (%), MA20, RSI'
          - 'clean ➔ $BTC BIG LONG : Clean Setup | 📍 Entry | 🛑 SL | 🎯 TP1-3'
          - 'conversational ➔ guys, have you seen what’s happening with $BTC ? 🚨 Question Hook'
          - 'danger_zone ➔ $BTC IS ENTERING CRITICAL DANGER ZONE ... WATCHING FOR UNWIND'
          - 'whale ➔ $BTC The harder they dump, harder the reversal! Whale trap thesis'
          - 'reversal ➔ I’m going to open a BIG LONG on $BTC here. Catch recovery wave!'
          - 'all ➔ (Show ALL 7 styles dummy preview together)'
        default: 'sniper ➔ 🚀 Guys, LONG $BTC Now! Entry: $92k | TP: $95k | SL: $90k'
      coin:
        description: 'Coin for dummy preview (e.g. BTC, ETH, SOL):'
        required: false
        type: string
        default: 'BTC'

jobs:
  show_dummy_preview:
    name: Generate Dummy Post Preview
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install pandas

      - name: Display Dummy Post Preview
        run: |
          python main.py --dummy-style "${{ github.event.inputs.post_style }}" --coin "${{ github.event.inputs.coin }}" | tee preview_out.txt
          echo "## 🎨 Post Style Preview Result" >> $GITHUB_STEP_SUMMARY
          echo '```text' >> $GITHUB_STEP_SUMMARY
          cat preview_out.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
